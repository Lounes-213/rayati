<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Rayti Pixel Logo - 100% Transparent Background -->
  <defs>
    <linearGradient id="raytiGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#00A859" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="raytiCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="stadiumGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#stadiumGlow)" transform="translate(10, 8)">
    <!-- Column 1 (Stem): 7 Pixels -->
    <rect x="6" y="6" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="6" y="17" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="6" y="28" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="6" y="39" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="6" y="50" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="6" y="61" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="6" y="72" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />

    <!-- Top Horizontal Bar -->
    <rect x="18" y="6" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="30" y="6" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="42" y="6" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />

    <!-- Top Loop Right Edge -->
    <rect x="54" y="14" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="54" y="25" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="54" y="36" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />

    <!-- Center Crossbar -->
    <rect x="18" y="39" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="30" y="39" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="42" y="39" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />

    <!-- Diagonal Leg / Arabic Raa (ر) Sweeping Pixels -->
    <rect x="30" y="50" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="42" y="61" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="54" y="72" width="10" height="9" rx="1.5" fill="url(#raytiGreen)" />
    <rect x="66" y="75" width="10" height="8" rx="1.5" fill="url(#raytiCyan)" />

    <!-- Accent Pixel Node (Stadium Beacon) -->
    <circle cx="23" cy="21" r="3.2" fill="#FFFFFF" opacity="0.95" />
    <circle cx="23" cy="21" r="5" fill="#34D399" opacity="0.4" />
  </g>
</svg>
