<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <!-- Rayti Logo with Typography - Transparent Background -->
  <defs>
    <linearGradient id="logoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#00A859" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(6, 6)">
    <!-- Pixel Mark (Icon) -->
    <g filter="url(#logoGlow)" transform="scale(0.8)">
      <!-- Stem -->
      <rect x="6" y="6" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="6" y="16" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="6" y="26" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="6" y="36" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="6" y="46" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="6" y="56" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="6" y="66" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />

      <!-- Top Bar -->
      <rect x="17" y="6" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="28" y="6" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="39" y="6" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />

      <!-- Loop Right Edge -->
      <rect x="50" y="14" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="50" y="24" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="50" y="34" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />

      <!-- Crossbar -->
      <rect x="17" y="36" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="28" y="36" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="39" y="36" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />

      <!-- Diagonal Leg / Arabic Raa -->
      <rect x="28" y="46" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="39" y="56" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="50" y="66" width="9" height="8" rx="1.5" fill="url(#logoGreen)" />
      <rect x="61" y="68" width="9" height="7" rx="1.5" fill="url(#logoCyan)" />

      <circle cx="21" cy="20" r="3" fill="#FFFFFF" opacity="0.95" />
    </g>

    <!-- Typography: English + Arabic -->
    <text x="76" y="42" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="2">RAYTI</text>
    <text x="180" y="42" font-family="'Cairo', sans-serif" font-size="28" font-weight="900" fill="#00A859">رايتي</text>
    <text x="78" y="58" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">تيفو الأضواء الذكية · STADIUM LIGHT SHOW</text>
  </g>
</svg>
