<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Rayti Maskable Icon (Full bleed dark background with center safe zone) -->
  <defs>
    <linearGradient id="pGreenM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#00A859" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="pCyanM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#0A0F1D" />

  <g transform="translate(130, 115) scale(2.8)">
    <!-- Column 1 (Stem) -->
    <rect x="6" y="6" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="6" y="17" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="6" y="28" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="6" y="39" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="6" y="50" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="6" y="61" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="6" y="72" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />

    <!-- Top Bar -->
    <rect x="18" y="6" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="30" y="6" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="42" y="6" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />

    <!-- Loop Right Edge -->
    <rect x="54" y="14" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="54" y="25" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="54" y="36" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />

    <!-- Crossbar -->
    <rect x="18" y="39" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="30" y="39" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="42" y="39" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />

    <!-- Diagonal Leg / Arabic Raa -->
    <rect x="30" y="50" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="42" y="61" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="54" y="72" width="10" height="9" rx="1.5" fill="url(#pGreenM)" />
    <rect x="66" y="75" width="10" height="8" rx="1.5" fill="url(#pCyanM)" />

    <circle cx="23" cy="21" r="3.2" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
